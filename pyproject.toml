[project]
name = "color-separator"
version = "0.1.0"
description = "This is a open-source tool for separating individual colors from a image."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]
